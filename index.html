<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghumantu – Your Personal Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a5276;
      --secondary: #c0392b;
      --accent: #f39c12;
      --bg: #f8f4ef;
      --card: #ffffff;
      --text: #2c3e50;
      --muted: #7f8c8d;
      --shadow: 0 10px 30px rgba(26, 82, 118, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(135deg, #1a5276 0%, #154360 50%, #922b21 100%);
      color: white;
      padding: 2.5rem 1.5rem 3rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%);
      animation: pulse 15s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      margin-bottom: 0.5rem;
      position: relative; z-index: 1;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    header p {
      font-size: 1.1rem; opacity: 0.95;
      position: relative; z-index: 1;
      max-width: 600px; margin: 0 auto;
    }
    .badge {
      display: inline-block;
      background: var(--accent);
      color: #1a1a1a;
      padding: 0.3rem 1rem;
      border-radius: 50px;
      font-size: 0.85rem; font-weight: 600;
      margin-top: 1rem;
      position: relative; z-index: 1;
    }
    .controls {
      max-width: 1200px;
      margin: -1.5rem auto 2rem;
      padding: 0 1.5rem;
      display: flex; flex-wrap: wrap; gap: 1rem;
      justify-content: center;
      position: relative; z-index: 2;
    }
    .search-box {
      flex: 1; min-width: 250px; max-width: 400px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 0.9rem 1.2rem 0.9rem 2.8rem;
      border: none; border-radius: 50px;
      font-size: 1rem;
      box-shadow: var(--shadow);
      outline: none;
      transition: box-shadow 0.3s;
    }
    .search-box input:focus {
      box-shadow: 0 10px 40px rgba(26, 82, 118, 0.25);
    }
    .search-box::before {
      content: '🔍';
      position: absolute; left: 1rem; top: 50%;
      transform: translateY(-50%); font-size: 1.1rem;
    }
    .filter-btns {
      display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;
    }
    .filter-btn {
      padding: 0.6rem 1.2rem;
      border: 2px solid var(--primary);
      background: white; color: var(--primary);
      border-radius: 50px; cursor: pointer;
      font-weight: 500; font-size: 0.9rem;
      transition: all 0.25s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--primary); color: white;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem 2rem;
      flex: 1;
    }
    .stats {
      text-align: center; margin-bottom: 2rem;
      color: var(--muted); font-size: 0.95rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
      display: flex; flex-direction: column;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(26, 82, 118, 0.2);
    }
    .card-img {
      height: 200px;
      background: linear-gradient(135deg, #3498db, #1a5276);
      position: relative;
      overflow: hidden;
    }
    .card-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s;
    }
    .card:hover .card-img img { transform: scale(1.05); }
    .card-img .fallback {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      font-size: 4rem; color: rgba(255,255,255,0.9);
      background: linear-gradient(135deg, #3498db, #1a5276);
    }
    .card-img .fallback.show {
      display: flex;
    }
    .card-body {
      padding: 1.25rem;
      flex: 1; display: flex; flex-direction: column;
    }
    .card-num {
      font-size: 0.75rem; color: var(--accent);
      font-weight: 600; letter-spacing: 1px;
    }
    .card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      margin: 0.3rem 0 0.4rem;
      color: var(--primary);
    }
    .card .location {
      font-size: 0.85rem; color: var(--muted);
      margin-bottom: 0.6rem;
    }
    .card .desc {
      font-size: 0.9rem; color: var(--text);
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-footer {
      display: flex; justify-content: flex-end; align-items: center;
      margin-top: 1rem; padding-top: 0.8rem;
      border-top: 1px solid #eee;
    }
    .rating {
      background: #27ae60; color: white;
      padding: 0.2rem 0.6rem; border-radius: 6px;
      font-size: 0.85rem; font-weight: 600;
    }
    .view-btn {
      background: none; border: none;
      color: var(--primary); font-weight: 600;
      cursor: pointer; font-size: 0.9rem;
    }
    .view-btn:hover { text-decoration: underline; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; padding: 1rem;
      backdrop-filter: blur(5px);
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white; border-radius: 20px;
      max-width: 640px; width: 100%;
      max-height: 92vh; overflow-y: auto;
      position: relative;
      animation: slideUp 0.35s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-header {
      background: linear-gradient(135deg, var(--primary), #154360);
      color: white; padding: 1.5rem;
      border-radius: 20px 20px 0 0;
      position: sticky; top: 0; z-index: 2;
    }
    .modal-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem; margin-bottom: 0.3rem;
      padding-right: 2.5rem;
    }
    .modal-close {
      position: absolute; top: 1rem; right: 1rem;
      background: rgba(255,255,255,0.2); border: none;
      color: white; width: 36px; height: 36px;
      border-radius: 50%; font-size: 1.4rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: rgba(255,255,255,0.35); }
    .modal-body { padding: 1.5rem; }
    .modal-img {
      height: 280px; border-radius: 12px;
      overflow: hidden; margin-bottom: 1.2rem;
      background: linear-gradient(135deg, #3498db, #1a5276);
      position: relative;
    }
    .modal-img img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .modal-img .fallback {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      font-size: 5rem; color: white;
      background: linear-gradient(135deg, #3498db, #1a5276);
    }
    .modal-img .fallback.show {
      display: flex;
    }
    .detail-row {
      display: flex; gap: 0.8rem;
      margin-bottom: 1rem; padding-bottom: 1rem;
      border-bottom: 1px solid #f0f0f0;
    }
    .detail-row:last-child { border: none; margin-bottom: 0; }
    .detail-icon { font-size: 1.4rem; flex-shrink: 0; }
    .detail-label {
      font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--muted); font-weight: 600;
    }
    .detail-value { font-size: 0.95rem; margin-top: 0.15rem; line-height: 1.5; }
    footer {
      text-align: center;
      padding: 1.5rem 1rem 2rem;
      color: var(--muted);
      font-size: 0.9rem;
      background: #e8e4df;
      margin-top: auto;
    }
    footer a { color: var(--primary); }
    .credit {
      margin-top: 0.5rem;
      font-weight: 600;
      color: var(--primary);
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      line-height: 1.5;
    }
    .no-results {
      text-align: center; padding: 3rem;
      color: var(--muted); grid-column: 1 / -1;
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      header { padding: 2rem 1rem; }
      .modal-img { height: 180px; }
    }

    .carousel {
      position: relative;
      width: 100%;
      height: 260px;
      border-radius: 12px;
      overflow: hidden;
      background: #1a5276;
      margin-bottom: 1.2rem;
    }
    .carousel-track {
      display: flex;
      height: 100%;
      transition: transform 0.35s ease;
    }
    .carousel-track img {
      min-width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.45);
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .carousel-btn:hover { background: rgba(0,0,0,0.7); }
    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }
    .carousel-btn.hidden { display: none; }
    .carousel-dots {
      position: absolute;
      bottom: 10px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 6px;
      z-index: 2;
    }
    .carousel-dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      cursor: pointer;
    }
    .carousel-dots span.active {
      background: white;
      transform: scale(1.2);
    }


    .section-block {
      margin-bottom: 1.1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #f0f0f0;
    }
    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #1a5276;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }


    
    
    .state-header {
      grid-column: 1 / -1;
      margin: 1.5rem 0 0.6rem;
      padding: 0.7rem 1rem;
      background: linear-gradient(90deg, #1a5276, #2874a6);
      color: white;
      border-radius: 10px;
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .state-header .count {
      font-family: 'Poppins', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      opacity: 0.9;
      margin-left: auto;
    }


    .index-panel {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      padding: 0 1.5rem;
    }
    .index-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      color: #1a5276;
      margin-bottom: 0.6rem;
      font-weight: 700;
    }
    .index-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }
    .index-item {
      background: white;
      border: 1px solid #d5dbdb;
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      font-size: 0.82rem;
      color: #2c3e50;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      transition: all 0.2s;
      text-align: left;
    }
    .index-item:hover, .index-item.active {
      background: #1a5276;
      color: white;
      border-color: #1a5276;
    }


    .index-wrap {
      max-width: 1200px;
      margin: 0 auto 1rem;
      padding: 0 1.5rem;
    }
    .index-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: white;
      border: 2px solid #1a5276;
      border-radius: 10px;
      padding: 0.55rem 1rem;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      color: #1a5276;
      font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(26,82,118,0.1);
    }
    .index-toggle:hover {
      background: #1a5276;
      color: white;
    }
    .index-toggle:hover .hamburger span {
      background: white;
    }
    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 18px;
    }
    .hamburger span {
      display: block;
      height: 2px;
      width: 100%;
      background: #1a5276;
      border-radius: 1px;
      transition: background 0.2s;
    }
    .index-panel {
      margin-top: 0.75rem;
      background: white;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 8px 24px rgba(26,82,118,0.12);
      border: 1px solid #e8e4df;
    }
    .index-panel[hidden] {
      display: none !important;
    }
    .index-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: #1a5276;
      margin-bottom: 0.6rem;
      font-weight: 700;
    }
    .index-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }
    .index-item {
      background: #f8f4ef;
      border: 1px solid #d5dbdb;
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      font-size: 0.82rem;
      color: #2c3e50;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      transition: all 0.2s;
      text-align: left;
    }
    .index-item:hover, .index-item.active {
      background: #1a5276;
      color: white;
      border-color: #1a5276;
    }

  </style>
</head>

  <script>
    // Image URLs: Wikimedia Commons (public domain / free license) for key monuments + Unsplash free photos for others
    const monuments = [
      {id:1, section:"top51", name:"Taj Mahal", location:"Agra, Uttar Pradesh", state:"Uttar Pradesh", rating:"4.8", desc:"Majestic white marble mausoleum built by Shah Jahan in memory of Mumtaz Mahal. One of the Seven Wonders of the World and UNESCO site.", timings:"Sunrise to Sunset, closed on Fridays", fee:"Indians ₹50, Foreigners ₹1300", speciality:"Epitome of Mughal architecture, symbol of love", emoji:"🕌", tags:["unesco","palace"],
        imgs:["https://www.holidify.com/images/cmsuploads/compressed/Taj_Mahal_20180814141729.png", "https://www.holidify.com/images/attr_wiki/compressed/attr_wiki_27.jpg", "https://www.holidify.com/images/attr_wiki/compressed/attr_wiki_20.jpg", "https://www.holidify.com/images/attr_wiki/compressed/attr_wiki_21.jpg"],
        overview:"Taj Mahal is located on the banks of the River Yamuna in Agra and is regarded as one of the Seven Wonders of the World. Built by Mughal Emperor Shah Jahan in the 17th century as a memorial for his wife Mumtaz Mahal, it also houses Shah Jahan's tomb. Constructed entirely of white marble with intricate inlay work of precious stones, it is a masterpiece of Mughal architecture and a UNESCO World Heritage Site.", tips:"Built by Shah Jahan between 1631–1648. Enter through East, West or South gates (East has shortest queues). Separate lines for men and women. Free water bottle and shoe covers included with ticket. Closed on Fridays. Best visited at sunrise. Carry valid ID. Photography of the main mausoleum interior may be restricted.", reach:"Distance: ~230 km from Delhi. Gatimaan Express (~1h 40m) to Agra Cantt or cab via Yamuna Expressway (3–4 hrs). Nearest airports: Agra (AGR) or Delhi (DEL). Local auto/taxi from station."},
      {id:2, section:"top51", name:"Mysore Palace", location:"Mysore, Karnataka", state:"Karnataka", rating:"4.4", desc:"Opulent royal residence showcasing Indo-Saracenic and Dravidian styles. Illuminated during Dasara festival.", timings:"10:00 AM to 5:30 PM, closed Sundays", fee:"Indians ₹70, Foreigners ₹200", speciality:"Vibrant lighting and royal heritage", emoji:"🏰", tags:["palace"],
        imgs:["https://www.holidify.com/images/cmsuploads/compressed/mysore-palace-116406_20180814152216.jpg", "https://www.holidify.com/images/compressed/attractions/attr_1376.jpg", "https://www.holidify.com/images/cmsuploads/compressed/MysorePalace2_Deeksha_20170820182648.JPG"],
        overview:"Mysore Palace (Amba Vilas Palace) is the official residence of the Wadiyar dynasty and the most famous tourist attraction in Mysore. It showcases a stunning blend of Indo-Saracenic, Hindu, Muslim, Rajput and Gothic styles. The palace is illuminated on Sundays and public holidays and becomes especially spectacular during the Dasara festival.", tips:"Open 10:00 AM–5:30 PM (closed some Sundays for ceremonies). Illumination in evenings on weekends/festivals. Photography inside may require extra fee. Remove footwear at certain sections. Best combined with a visit to Chamundi Hills.", reach:"Distance: ~140 km from Bengaluru. Nearest airport: Mysore (MYQ) or Bengaluru (BLR, ~3h drive). Train to Mysore Junction. Local auto/taxi to palace."},
      {id:3, section:"top51", name:"Golden Temple", location:"Amritsar, Punjab", state:"Punjab", rating:"4.5", desc:"Holiest Sikh shrine, gold-covered building surrounded by sacred lake (Amrit Sarovar). Free langar for all.", timings:"Open 24 hours", fee:"Free", speciality:"Spiritual significance, gold architecture", emoji:"🛕", tags:["temple"],
        imgs:["https://www.holidify.com/images/cmsuploads/compressed/golden-temple-397886_1920_20180814155122.jpg", "https://www.holidify.com/images/cmsuploads/compressed/Golden_temple_Amritsar_by_Bha_20170809172103.jpg", "https://www.holidify.com/images/cmsuploads/compressed/golden-3030118_960_720_20190314172642.jpg", "https://www.holidify.com/images/cmsuploads/compressed/img_5551_20180414001357.jpg", "https://www.holidify.com/images/cmsuploads/compressed/9690060335_456315e83b_b_20170809174315.jpg"],
        overview:"The Golden Temple (Sri Harmandir Sahib) is the holiest Gurdwara of Sikhism, located in Amritsar. The sanctum is covered in gold and sits in the middle of the sacred Amrit Sarovar (pool of nectar). It is famous for its spiritual atmosphere and the free community kitchen (langar) that serves thousands daily.", tips:"Open 24 hours. Cover your head (scarves available free). Remove shoes and wash feet before entering. Photography of the sanctum may be restricted. Free langar is open to all. Best early morning or evening for serene views.", reach:"Distance: ~450 km from Delhi / ~250 km from Chandigarh. Amritsar Airport (ATQ) or train to Amritsar Jn. Auto/rickshaw or walk (city centre)."},

    let currentFilter = 'all';
    let currentSection = 'top51';
    let searchQuery = '';

    
    function toggleIndex() {
      var panel = document.getElementById('index-panel');
      if (panel) panel.hidden = !panel.hidden;
    }

    function selectSection(key) {
      currentSection = key;
      document.querySelectorAll('.index-item').forEach(function(b) {
        b.classList.toggle('active', b.dataset.section === key);
      });
      currentFilter = 'all';
      var panel = document.getElementById('index-panel');
      if (panel) panel.hidden = true;
      render();
      var c = document.querySelector('.container');
      if (c) window.scrollTo({ top: c.offsetTop - 20, behavior: 'smooth' });
    }

    function render() {
      const grid = document.getElementById('grid');
      const source = (currentSection === 'top51')
        ? monuments
        : statePlaces.filter(p => currentSection === ('state:' + p.state));
      let filtered = source.filter(m => {
        const q = searchQuery;
        if (!q) return true;
        return (m.name && m.name.toLowerCase().includes(q)) ||
          (m.location && m.location.toLowerCase().includes(q)) ||
          (m.state && m.state.toLowerCase().includes(q)) ||
          (m.desc && m.desc.toLowerCase().includes(q));
      });

      document.getElementById('stats').textContent =
        currentSection === 'top51'
          ? ('Showing ' + filtered.length + ' of 51 places')
          : ('Showing ' + filtered.length + ' places');

      function cardHTML(m) {
        var imgSrc = (m.imgs && m.imgs[0]) || m.img || '';
        return '<div class="card" onclick="openModal(' + m.id + ')">' +
          '<div class="card-img"><div class="fallback"></div>' +
          '<img src="' + imgSrc + '" alt="' + (m.name || '') + '" loading="lazy" style="display:block;" ' +
          "onerror=\"this.style.display='none'; this.previousElementSibling.classList.add('show'); this.previousElementSibling.textContent='🏛️';\">" +
          '</div><div class="card-body">' +
          '<div class="card-num">#' + String(m.id).padStart(2,'0') + '</div>' +
          '<h3>' + (m.name || '') + '</h3>' +
          '<div class="location">📍 ' + (m.location || '') + '</div>' +
          '<div class="desc">' + (m.desc || '') + '</div>' +
          '<div class="card-footer"><button class="view-btn" style="margin-left:auto;">View Details →</button></div>' +
          '</div></div>';
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-results">No places match your search.</div>';
        return;
      }

      if (currentSection === 'top51') {
        filtered.sort(function(a, b) { return a.id - b.id; });
        grid.innerHTML = filtered.map(cardHTML).join('');
        return;
      }

      if (currentSection.indexOf('state:') === 0) {
        var st = currentSection.slice(6);
        grid.innerHTML = '<div class="state-header">' + st +
          '<span class="count">' + filtered.length + ' place' + (filtered.length !== 1 ? 's' : '') + '</span></div>' +
          filtered.map(cardHTML).join('');
        return;
      }

      grid.innerHTML = filtered.map(cardHTML).join('');
    }

    function setFilter(f) { currentFilter = f; render(); }

    function filterCards() {
      searchQuery = document.getElementById('search').value.toLowerCase().trim();
      render();
    }

    function openModal(id) {
      let m = monuments.find(x => x.id === id);
      if (!m && typeof statePlaces !== 'undefined') {
        m = statePlaces.find(x => x.id === id);
      }
      if (!m) return;
      document.getElementById('m-title').textContent = m.name;
      document.getElementById('m-location').textContent = '📍 ' + m.location;
      document.getElementById('m-desc').textContent = m.desc;
      const ovEl = document.getElementById('m-overview');
      const tipsEl = document.getElementById('m-tips');
      if (ovEl) ovEl.textContent = m.overview || m.desc || '';
      if (tipsEl) tipsEl.textContent = m.tips || '';
      document.getElementById('m-timings').textContent = m.timings;
      document.getElementById('m-fee').textContent = m.fee;
      document.getElementById('m-speciality').textContent = m.speciality;
      document.getElementById('m-reach').textContent = m.reach || 'Check local transport options from nearest major city.';

      // Gallery carousel
      const track = document.getElementById('m-track');
      const dots = document.getElementById('m-dots');
      const prevBtn = document.getElementById('m-prev');
      const nextBtn = document.getElementById('m-next');
      const photos = (m.imgs && m.imgs.length) ? m.imgs : (m.img ? [m.img] : []);
      if (!photos.length) {
        // placeholder so modal still opens cleanly
        track.innerHTML = '<div style="min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a5276,#2874a6);color:white;font-size:3rem;">🏛️</div>';
        dots.innerHTML = '';
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        document.getElementById('modal').classList.add('active');
        document.body.style.overflow = 'hidden';
        return;
      }
      let slide = 0;

      track.innerHTML = '';
      dots.innerHTML = '';
      photos.forEach((src, i) => {
        const im = document.createElement('img');
        im.src = src;
        im.alt = m.name + (i ? ' photo ' + (i+1) : '');
        im.loading = i === 0 ? 'eager' : 'lazy';
        im.onerror = function() { this.style.display='none'; };
        track.appendChild(im);
        const dot = document.createElement('span');
        if (i === 0) dot.classList.add('active');
        dot.onclick = () => goTo(i);
        dots.appendChild(dot);
      });

      function goTo(i) {
        slide = i;
        track.style.transform = 'translateX(-' + (slide * 100) + '%)';
        dots.querySelectorAll('span').forEach((d, j) => d.classList.toggle('active', j === slide));
        prevBtn.classList.toggle('hidden', photos.length <= 1);
        nextBtn.classList.toggle('hidden', photos.length <= 1);
      }
      prevBtn.onclick = () => goTo((slide - 1 + photos.length) % photos.length);
      nextBtn.onclick = () => goTo((slide + 1) % photos.length);
      goTo(0);
      if (photos.length <= 1) {
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
      }

      document.getElementById('modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('modal') && !e.target.classList.contains('modal-close')) return;
      document.getElementById('modal').classList.remove('active');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // Init index
    const firstIdx = document.querySelector('.index-item[data-section="top51"]');
    if (firstIdx) firstIdx.classList.add('active');
    render();
  </script>
